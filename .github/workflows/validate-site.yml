name: Validate website scripts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-inline-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript in site pages
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile, sys

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False

          pages = [Path("index.html"), Path("admin.html")]
          errors = []
          for page in pages:
              if not page.exists():
                  errors.append(f"Missing required page: {page}")
                  continue
              parser = ScriptExtractor()
              parser.feed(page.read_text(encoding="utf-8"))
              for i, script in enumerate(parser.scripts, 1):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                      f.write(script)
                      f.flush()
                      result = subprocess.run(["node", "--check", f.name], capture_output=True, text=True)
                      if result.returncode:
                          errors.append(f"{page}: inline script {i} failed syntax check:\\n{result.stderr}")
              print(f"{page}: checked {len(parser.scripts)} inline script(s)")
          if errors:
              print("\\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Inline JavaScript syntax checks passed.")
          PY
