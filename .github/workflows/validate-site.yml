name: Validate website scripts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-inline-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript in site pages
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile, sys

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False

          pages = [Path("index.html"), Path("admin.html")]
          errors = []
          for page in pages:
              if not page.exists():
                  errors.append(f"Missing required page: {page}")
                  continue
              parser = ScriptExtractor()
              parser.feed(page.read_text(encoding="utf-8"))
              for i, script in enumerate(parser.scripts, 1):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                      f.write(script)
                      f.flush()
                      result = subprocess.run(["node", "--check", f.name], capture_output=True, text=True)
                      if result.returncode:
                          errors.append(f"{page}: inline script {i} failed syntax check:\\n{result.stderr}")
              print(f"{page}: checked {len(parser.scripts)} inline script(s)")
          if errors:
              print("\\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Inline JavaScript syntax checks passed.")
          PY
      - name: Validate local assets and section links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import sys

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  for attr in ("href", "src"):
                      value = attrs.get(attr)
                      if value:
                          self.refs.append((attr, value))

          errors = []
          root = Path(".").resolve()
          pages = [Path("index.html"), Path("admin.html")]
          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              parsed[page] = parser
          for page, parser in parsed.items():
              for attr, ref in parser.refs:
                  ref = ref.strip()
                  if not ref or ref.startswith(("//", "http://", "https://", "mailto:", "tel:", "javascript:", "data:")):
                      continue
                  parts = urlsplit(ref)
                  if parts.path.startswith("/"):
                      continue
                  if parts.path:
                      target = (page.parent / unquote(parts.path)).resolve()
                      if root not in target.parents and target != root:
                          errors.append(f"{page}: {attr} escapes repository: {ref}")
                      elif not target.exists():
                          errors.append(f"{page}: missing local target: {ref}")
                  if parts.fragment and parts.path in ("",):
                      if unquote(parts.fragment) not in parser.ids:
                          errors.append(f"{page}: missing section id: #{unquote(parts.fragment)}")
          if errors:
              print("\\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Local asset and in-page section checks passed.")
          PY
