<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080a09">
  <title>Page Not Found | AENZO LABS</title>
  <style>
    :root{color-scheme:dark;--bg:#080a09;--panel:#111512;--gold:#d9bd79;--muted:#a9b0a9;--line:#343a31}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#1c241b 0%,var(--bg) 58%);color:#f4f0e5;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,6vw,56px);border:1px solid var(--line);border-radius:24px;background:rgba(17,21,18,.92);text-align:center;box-shadow:0 24px 90px #0008}
    .brand{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:800}
    .code{margin:26px 0 0;color:var(--gold);font-size:clamp(64px,14vw,104px);line-height:1;font-weight:800;letter-spacing:-.06em}
    h1{margin:16px 0 8px;font-size:clamp(25px,5vw,36px);line-height:1.2}
    p{margin:0 auto;color:var(--muted);max-width:440px}
    nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    a{display:inline-block;padding:11px 18px;border-radius:999px;border:1px solid var(--line);color:#f4f0e5;text-decoration:none;font-weight:650}
    a.primary{background:var(--gold);border-color:var(--gold);color:#11140f}
    a:focus-visible{outline:3px solid #f4f0e5;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="brand">AENZO LABS</div>
    <div class="code" aria-label="Error 404">404</div>
    <h1>This page could not be found</h1>
    <p>The link may be outdated or the page may have moved. Return to AENZO LABS to continue exploring our Web3 marketing and community services.</p>
    <nav aria-label="Recovery links">
      <a class="primary" href="./">Back to homepage</a>
      <a href="./#services">Explore services</a>
      <a href="./#contact">Contact us</a>
    </nav>
  </main>
</body>
</html>
